apiVersion: v1
kind: Service
metadata:
  name: lbtest-app-service

spec:
  type: NodePort

  selector:
    app: lbtest-app

  ports:
    - port: 3091
      targetPort: 3000
      nodePort: 30091

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbtest-app

  labels:
    app: lbtest-app

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: lbtest-app

  template:
    metadata:
      labels:
        app: lbtest-app

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: lbtest-app
          image: ghcr.io/rakafde/lbtest:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: "v1"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lbtest-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app1.rakafitrap.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lbtest-app-service
            port:
              number: 3091
