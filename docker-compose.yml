version: "3.9"

services:

  app-v1:
    build: ./app
    container_name: app-v1
    environment:
      APP_VERSION: v1
    expose:
      - "3000"

  app-v2:
    build: ./app
    container_name: app-v2
    environment:
      APP_VERSION: v2
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-v1
      - app-v2